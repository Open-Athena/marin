[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-execution"
version = "0.2.0"
description = "Marin's step executor: StepSpec, StepRunner, lazy artifacts and step status, without the ML stack."
requires-python = ">=3.12,<3.14"
dependencies = [
    "marin-fray",
    "marin-iris",
    "marin-rigging",
    "numpy",
    "pydantic>=2.0",
]

[project.license]
file = "../../LICENSE"

[dependency-groups]
test = [
    # test_fingerprint covers jax arrays; jax is not a runtime dependency.
    "jax>=0.9.2,<0.13",
    "pytest>=8.3.2",
    "pytest-timeout",
    "pytest-xdist",
]

# `marin` is a namespace package shared with marin-core: this wheel ships only
# `marin/execution/`, and neither distribution ships `marin/__init__.py`.
[tool.hatch.build.targets.wheel]
packages = ["src/marin"]

[tool.hatch.build.targets.sdist]
packages = ["src/marin"]

[tool.pytest.ini_options]
timeout = 60
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--import-mode=importlib"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["marin"]
known-local-folder = []
